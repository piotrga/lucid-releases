name: Release Lucid Language
on:
  push:
    branches: [main]
    paths: ['plugin/.claude-plugin/plugin.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 tools/build.py
      - name: Test a fresh project install from this GitHub commit
        run: |
          npm install --prefix "$RUNNER_TEMP/lucid-cli" --no-audit --no-fund @anthropic-ai/claude-code@2.1.319
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/lucid-config"
          cli="$RUNNER_TEMP/lucid-cli/node_modules/.bin/claude"
          "$cli" plugin validate .
          "$cli" plugin validate plugin
          bash checks/hooks.sh "$cli"
          git init -q "$RUNNER_TEMP/lucid-project"
          cd "$RUNNER_TEMP/lucid-project"
          "$cli" plugin install lucid-language --marketplace "$GITHUB_REPOSITORY" --scope project
          installed=$("$cli" plugin list --json | jq -er '.[] | select(.id == "lucid-language@lucid-releases" and .enabled and .scope == "project") | .installPath')
          diff -r --exclude=.in_use "$GITHUB_WORKSPACE/plugin" "$installed"
      - name: Publish and verify public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release.sh
